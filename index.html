*{box-sizing:border-box}body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}

.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}.bar i{display:block;height:14px;border-radius:4px;background:var(--brand);min-width:2px}.bar em{font-style:normal;color:var(--mute);width:125px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cbl{position:absolute;left:0;right:0;top:32px;z-index:50;max-height:330px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:3px 0;min-width:180px}.cbl[hidden]{display:none}
.cbo{font-size:12px;line-height:1.2;padding:5px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid transparent}.cbo:hover{background:rgba(127,127,127,.16)}.cbo.sel{background:rgba(127,127,127,.12);border-left-color:var(--brand);font-weight:600}.cbo.none{color:var(--mute);cursor:default}.filters .fr:first-child input{flex:1 1 100%;max-width:520px}.filters input{min-width:220px}
.chip{padding:5px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--mute)}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}.dual{display:inline-flex;align-items:center;gap:8px}.dr{position:relative;width:150px;height:20px}.dr input{position:absolute;left:0;top:0;width:100%;margin:0;pointer-events:none;-webkit-appearance:none;appearance:none;background:none;height:20px}.dr input::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:2px}.dr input::-moz-range-track{height:4px;background:var(--line);border-radius:2px}.dr input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--brand);border:2px solid #fff;margin-top:-6px;cursor:pointer}.dr input::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;background:var(--brand);border:2px solid #fff;cursor:pointer}.chip.rst{color:#c62828;border-color:#c62828}

.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}.btn.g{background:var(--brand2);color:var(--brand)}
textarea{width:100%;min-height:64px;margin-bottom:6px}
.score{display:flex;gap:18px;align-items:center;margin-bottom:14px}

.sc{margin:8px 0;font-size:12px}.sc .t{display:flex;justify-content:space-between}.sc .tr{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}.sc .tr i{display:block;height:100%;background:var(--brand)}
.empty{color:var(--mute);text-align:center;padding:26px;border:1px dashed var(--line);border-radius:10px}
.ban{background:var(--brand2);color:var(--brand);padding:8px 12px;border-radius:10px;margin-bottom:12px;font-size:12px}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:10;display:none}.mask.on{display:block}
.row{display:flex;gap:8px;margin:6px 0;align-items:center;flex-wrap:wrap}.row input[type=range]{flex:1}
a.lk{color:var(--brand);text-decoration:none;cursor:pointer}

.dots{color:var(--brand);letter-spacing:1px;white-space:nowrap}.dots i{color:var(--line);font-style:normal}
.yn{display:inline-block;min-width:26px;text-align:center;border-radius:6px;font-weight:700;font-size:12px;padding:1px 4px}.yn.y{background:#e3f6ec;color:var(--good)}.yn.n{background:var(--bg);color:var(--mute)}.yn.u{color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}.seg a{padding:6px 14px;cursor:pointer;color:var(--mute)}.seg a.on{background:var(--brand);color:#fff}
.ft{width:100%;font-size:12.5px;margin:6px 0}.ft td,.ft th{padding:6px 8px;border-bottom:1px solid var(--line);position:static;cursor:default}.ft td.l{font-weight:600}.ft tr.p td{color:var(--mute);font-size:12px;font-style:italic}.ft td.e{font-style:italic;color:var(--mute)}.ft td.mn{font-weight:700;color:var(--brand)}.ft td.ed{cursor:pointer}.ft td.ed:hover{background:var(--brand2)}
.sim{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}.sim:hover{background:var(--brand2)}.sim .pc{font-weight:700;color:var(--brand);width:44px}
.mt{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.mt .card b{font-size:24px}.mt .d{font-size:12px}.up{color:var(--bad)}.dn{color:var(--good)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px;background:var(--card);padding:12px;border-radius:12px;box-shadow:var(--shadow)}
html{-webkit-text-size-adjust:100%}
.grid2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.mt{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
@media(max-width:800px){

 #app{display:block}

 nav::-webkit-scrollbar{display:none}

 main{padding:14px 14px calc(84px + env(safe-area-inset-bottom));padding-top:calc(14px + env(safe-area-inset-top))}
 h1{font-size:19px}
 .top{margin-bottom:12px}
 .user select{display:none}
 .cards{grid-template-columns:repeat(2,1fr);gap:10px}
 .card{padding:13px}.kpi b{font-size:22px}
 .grid2,.mt{gap:10px}

 .filters{gap:6px}.filters input{min-width:0;flex:1 1 100%}.filters select{min-width:0;flex:1 1 45%}

 input,select,textarea,input[type=text],input[type=search],input[type=password]{font-size:16px!important}

 td{padding:11px 10px}th{padding:10px}
 .nm{max-width:170px}
 .drawer{width:100%;height:100dvh;box-shadow:none}
 .dh{padding:calc(14px + env(safe-area-inset-top)) 14px 0}
 .db{padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
 .x{font-size:30px;padding:0 6px;line-height:1}

 .kv{grid-template-columns:repeat(2,1fr)}
 .score{gap:12px}.ring{width:80px;height:80px}.ring div{width:60px;height:60px;font-size:20px}

}

#syncbar{position:fixed;right:12px;bottom:10px;z-index:5;font-size:11px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;box-shadow:var(--shadow);max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#syncbar:empty{display:none}
@media(max-width:800px){#syncbar{bottom:calc(74px + env(safe-area-inset-bottom));right:8px}}

<body>
<div id="app">
<nav id="nav"></nav>
<main><div class="top"><h1 id="title"></h1><div class="user"><div class="av" id="av"></div><select id="usel"></select></div></div><div id="view"></div></main>
</div>
<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer"></aside>
<script src="config.js"></script>
<script src="data/news.js"></script>
<script src="data/industry.js"></script>
<script src="data/macro.js"></script>
<script src="data/xlsx.full.min.js"></script>
<script>
/* Il DB (societa' e fondi) si legge da data/db.xlsx: per aggiornarlo basta sostituire quel file nel repository. */
(function(){
  const num=v=>typeof v==='number'&&v>20000&&v<80000?new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,7):v;
  const rows=(wb,n)=>{const w=wb.Sheets[n];if(!w)throw new Error('Foglio mancante in db.xlsx: '+n);return XLSX.utils.sheet_to_json(w,{defval:null,raw:true})};
  const fail=e=>{document.body.insertAdjacentHTML('afterbegin','<div style="padding:24px;font:15px sans-serif;color:#b00020">Impossibile caricare data/db.xlsx ('+String(e&&e.message||e).replace(/</g,'&lt;')+'). In locale servono un server (es. <code>python -m http.server</code>): aprendo il file dal disco il browser blocca la lettura.</div>')};
  fetch('data/db.xlsx?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.arrayBuffer()}).then(b=>{
    const wb=XLSX.read(b,{type:'array'});
    const companies=rows(wb,'Companies'),investors=rows(wb,'Investors'),meta={};
    rows(wb,'Meta').forEach(r=>meta[r.key]=r.value);
    companies.forEach(c=>{if(c.deal!=null)c.deal=String(num(c.deal))});
    investors.forEach(i=>{if(i.flagV!=null)i.flagV=String(num(i.flagV));if(i.port!=null)i.port=String(i.port)});
    window.DBX={companies,investors,asof:String(meta.asof??''),dbv:String(meta.dbv??''),dedup:Number(meta.dedup||0)};
    const el=document.createElement('script');el.textContent=document.getElementById('appsrc').textContent;document.body.appendChild(el);
  }).catch(fail);
})();
</script>
<script id="appsrc" type="text/plain">
const D=window.DBX;
const C=D.companies,I=D.investors,invById={};I.forEach(i=>{if(i.id!=null)invById[i.id]=i});
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const KEY='pe_monitor_proto_v2',KEY1='pe_monitor_proto_v1';
const DEF=()=>({tomb:{},wts:0,users:['Tu'],me:0,watch:{},comments:[],persons:[],rel:[],news:[],over:{},ap:{},fin:{},macro:{},research:[],msrc:{},mcust:{},nid:1,w:{hold:35,lev:20,grow:20,size:10,inv:15}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){try{const o=JSON.parse(localStorage.getItem(KEY1));if(o){S=o;S.persons=[];S.rel=[];S.nid=1;(o.contacts||[]).forEach(x=>{const n=(x.name||'').split(' ');S.persons.push({id:S.nid,first:n[0]||'',last:n.slice(1).join(' '),role:x.role||'',pe:'',co:x.c,info:x.info||''});S.rel.push({p:S.nid,u:x.u,conf:3,ts:x.ts});S.nid++});delete S.contacts}}catch(e){}}
S=Object.assign(DEF(),S||{});if(S.dbv!==D.dbv){const k=S;S=Object.assign(DEF(),{users:k.users,me:k.me,w:k.w,macro:k.macro,research:k.research,msrc:k.msrc,mcust:k.mcust,nid:k.nid});S.dbv=D.dbv}
const tomb=(t,id)=>{(S.tomb=S.tomb||{})[t+':'+id]=Date.now()};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}try{window.syncPush&&syncPush()}catch(e){}};
let view='dash',F={q:'',sector:'',sub:'',subInd:'',vert:'',own:'',inv:'',min:'',smin:0,smax:100,ap:'',wl:'me'},sort={k:'score',d:-1},tab='ov',open=null;
/* ---------- helpers ---------- */
const n1=(v,d=1)=>v==null?'–':Number(v).toLocaleString('it-IT',{maximumFractionDigits:d,minimumFractionDigits:d});
const m=(v)=>v==null?'–':Math.abs(v)>=1000?n1(v/1000,2)+' mld':n1(v,1)+' m';
const pc=v=>v==null?'–':n1(v,1)+'%';
const lerp=(x,pts)=>{for(let i=1;i<pts.length;i++)if(x<=pts[i][0]){const[a,b]=[pts[i-1],pts[i]];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}return pts[pts.length-1][1]};
const NOW=2026+10/12;
const holdY=c=>{if(!c.deal)return null;const[y,mo]=c.deal.split('-').map(Number);return Math.max(0,NOW-(y+(mo-1)/12))};
/* ---------- exit score ---------- */
function score(c){
  if(!['PE majority','PE minority'].includes(c.own))return null;
  const h=holdY(c),inv=invById[c.majId];
  const parts={
    hold:{l:'Vintage / anni di holding',v:h==null?.5:lerp(h,[[0,0],[2,.1],[3,.35],[4,.6],[5,.85],[6,1],[8,1],[10,.85],[14,.75]]),d:h==null?'dato assente':n1(h,1)+' anni'},
    lev:{l:'Leva (Net debt / EBITDA)',v:c.ndE==null?.5:c.ndE<=2?1:lerp(c.ndE,[[2,1],[3.5,.8],[5,.5],[7,.2],[10,.05]]),d:c.ndE==null?'dato assente':n1(c.ndE,1)+'x'},
    grow:{l:'Crescita (CAGR EBITDA/ricavi 3Y)',v:(()=>{const g=c.eb3??c.rev3??c.rev2;return g==null?.5:lerp(g,[[-10,0],[0,.15],[5,.5],[15,1],[40,1]])})(),d:pc(c.eb3??c.rev3??c.rev2)},
    size:{l:'Dimensione (EBITDA)',v:c.ebitda==null?.4:lerp(c.ebitda,[[0,.05],[3,.25],[10,.7],[25,1],[500,1]]),d:m(c.ebitda)},
    inv:{l:'Attività exit del fondo (L5Y)',v:(!inv||inv.exits==null)?.5:Math.min(1,inv.exits/Math.max(inv.entries||1,1)),d:inv?`${inv.exits??'–'} exit / ${inv.entries??'–'} ingressi`:'fondo non in elenco'}
  };
  const W=S.w,tot=W.hold+W.lev+W.grow+W.size+W.inv||1;
  const calc=Math.round(100*(parts.hold.v*W.hold+parts.lev.v*W.lev+parts.grow.v*W.grow+parts.size.v*W.size+parts.inv.v*W.inv)/tot);
  const ov=S.over[c.id];
  return{calc,final:ov?ov.v:calc,ov,parts,W}
}
const lvl=s=>s==null?['n/d','b-na']:s>=65?['Alto','b-hi']:s>=40?['Medio','b-md']:['Basso','b-lo'];
const badge=s=>{const[l,k]=lvl(s);return `<span class="badge ${k}" title="${l}">${s==null?'–':s}</span>`};
let SC={};const rescore=()=>{C.forEach(c=>SC[c.id]=score(c))};rescore();
/* ---------- watchlist ---------- */
const wl=u=>S.watch[u]||(S.watch[u]=[]);
const inWl=(id,u=S.me)=>wl(u).includes(id);
const toggleWl=id=>{const a=wl(S.me),i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);save();render()};

const FM=[['rev','Ricavi','revY','rev2'],['gm','Margine lordo','gmY','gm2'],['ebitda','EBITDA','ebitdaY','eb2'],['ebit','EBIT','ebitY','ebit2'],['fte','Dipendenti (FTE)','fteY','fte2'],['debt','Debito finanziario','debtY',null],['cash','Cassa','cashY',null],['nd','Debito netto','ndY',null]];
function fval(c,k,yr){
  const man=(S.fin[c.id]||{})[k+yr];if(man!=null)return{v:man,t:'m'};
  const row=FM.find(r=>r[0]==k),v=c[k],y=c[row[2]]||c.revY;if(v==null||!y)return null;
  if(yr==y)return{v,t:'a'};
  const g=row[3]?(c[row[3]]??c[row[3].replace('2','3')]):null;
  if(g!=null&&v>0&&yr<y&&yr>=y-2){return{v:v/Math.pow(1+g/100,y-yr),t:'e'}}
  return null}
function fin(c){
  const L=Math.max(c.revY||0,c.ebitdaY||0)||2025,Y=[L-2,L-1,L],cell=(k,yr,f)=>{const x=fval(c,k,yr);return x?`<td class="n ${x.t=='e'?'e':x.t=='m'?'mn':''} ed" title="${x.t=='e'?'Stima da CAGR':x.t=='m'?'Inserito a mano':'Dato file'} – clic per modificare" onclick="editFin(${c.id},'${k}',${yr})">${x.t=='e'?'~':''}${f(x.v)}</td>`:`<td class="n ed" onclick="editFin(${c.id},'${k}',${yr})">–</td>`};
  const V=(k,yr)=>fval(c,k,yr)?.v;
  const pr=(lbl,fn,f)=>`<tr class="p"><td>${lbl}</td>${Y.map(yr=>{const x=fn(yr);return `<td class="n">${x==null||!isFinite(x)?'–':f(x)}</td>`}).join('')}</tr>`;
  const num=v=>n1(v,1),pct=v=>n1(v,1)+'%';
  const rows=[
   ['rev',num],pr('crescita ricavi %',yr=>{const a=V('rev',yr),b=V('rev',yr-1);return a!=null&&b?(a/b-1)*100:null},pct),
   ['gm',num],pr('margine lordo %',yr=>V('gm',yr)!=null&&V('rev',yr)?V('gm',yr)/V('rev',yr)*100:null,pct),
   ['ebitda',num],pr('margine EBITDA %',yr=>V('ebitda',yr)!=null&&V('rev',yr)?V('ebitda',yr)/V('rev',yr)*100:null,pct),
   ['ebit',num],pr('margine EBIT %',yr=>V('ebit',yr)!=null&&V('rev',yr)?V('ebit',yr)/V('rev',yr)*100:null,pct),
   ['fte',v=>n1(v,0)],pr('ricavi / FTE (k€)',yr=>V('fte',yr)&&V('rev',yr)!=null?V('rev',yr)/V('fte',yr)*1000:null,v=>n1(v,0)),
   ['debt',num],['cash',num],['nd',num],pr('Net debt / EBITDA (x)',yr=>V('nd',yr)!=null&&V('ebitda',yr)>0?V('nd',yr)/V('ebitda',yr):null,v=>n1(v,1)+'x')];
  const tb=rows.map(r=>Array.isArray(r)?`<tr><td class="l">${FM.find(f=>f[0]==r[0])[1]}</td>${Y.map(yr=>cell(r[0],yr,r[1])).join('')}</tr>`:r).join('');
  const kp=[['Margine EBITDA',pc(c.ebitdaP)],['Margine lordo',pc(c.gmP)],['Margine EBIT',pc(c.ebitP)],['Net debt / EBITDA',c.ndE==null?'–':n1(c.ndE,1)+'x'],['Ricavi / FTE',c.rfte==null?'–':n1(c.rfte/1000,0)+' k€'],['Cash conv. (EBITDA–capex)',c.ebCapex!=null&&c.ebitda>0?pc(c.ebCapex/c.ebitda*100):'–']];
  const g=[['CAGR ricavi 2Y',c.rev2],['CAGR ricavi 3Y',c.rev3],['CAGR EBITDA 2Y',c.eb2],['CAGR EBITDA 3Y',c.eb3],['CAGR EBIT 3Y',c.ebit3],['CAGR FTE 3Y',c.fte3]];
  return `<div class="ban">€ milioni. Ultimo anno = dato del file${c.revAI=='Yes'||c.ebAI=='Yes'?' (alcuni valori sono stime AI)':''}; <i>~anni precedenti</i> = stimati dai CAGR del file (non sono bilanci reali). Clicca una cella per inserire il dato vero: diventa blu e resta per tutto il team. Collegamento a Moody's previsto in produzione.</div>
  <div class="kv" style="margin-bottom:14px">${kp.map(([l,v])=>`<div><b>${v}</b><span>${l}</span></div>`).join('')}</div>
  <h2>Conto economico e stato patrimoniale – ultimi 3 anni</h2>
  <table class="ft"><thead><tr><th></th>${Y.map(y=>`<th class="n">${y}</th>`).join('')}</tr></thead><tbody>${tb}</tbody></table>
  <h2 style="margin-top:16px">Crescita</h2>${g.map(r=>`<div class="bar"><em>${r[0]}</em><i style="width:${r[1]==null?0:Math.min(100,Math.abs(r[1])*2)}%;background:${(r[1]||0)<0?'var(--bad)':'var(--good)'}"></i><span>${pc(r[1])}</span></div>`).join('')}`}
function editFin(id,k,yr){const o=S.fin[id]||(S.fin[id]={}),cur=o[k+yr],t=prompt(`${FM.find(f=>f[0]==k)[1]} ${yr} (€m). Lascia vuoto per tornare al dato del file.`,cur??'');if(t==null)return;if(t.trim()==='')delete o[k+yr];else{const v=parseFloat(t.replace(',','.'));if(isNaN(v))return alert('Numero non valido');o[k+yr]=v}save();drawer()}
function exitT(c,s){

  return `<div class="score"><div class="ring" style="background:conic-gradient(${col} ${s.final*3.6}deg,var(--bg) 0)"><div>${s.final}</div></div><div><b>Probabilità di exit: ${lvl(s.final)[0]}</b><div class="sub">Calcolato: ${s.calc}${ov?` · override di ${esc(S.users[ov.u])}: ${ov.v} (“${esc(ov.why)}”)`:''}</div></div></div>
  ${Object.entries(s.parts).map(([k,p])=>`<div class="sc"><div class="t"><span>${p.l} <small class="sub">(peso ${s.W[k]})</small></span><span>${p.d} → ${Math.round(p.v*100)}/100</span></div><div class="tr"><i style="width:${p.v*100}%"></i></div></div>`).join('')}

const cPersons=c=>S.persons.filter(p=>p.co==c.id||(c.maj&&p.pe==c.maj));
function ctT(c){

  ${L.map(({p,t})=>`<div class="cm"><b>${esc(p.first)} ${esc(p.last)}</b> · ${esc(p.role||'')} <small>${esc(p.pe||'')}</small><br>${t?`Referente: <b>${esc(S.users[t.u])}</b> ${dots(t.conf)}`:''} <small>${relsOf(p.id).length} utenti lo conoscono</small></div>`).join('')||'<div class="empty">Nessun contatto. Aggiungine uno sopra o dalla pagina Contatti.</div>'}`}

const syncReady=()=>!!(SYNC.url&&SYNC.name&&(SYNC.az||SYNC.key));
try{SYNC.key=localStorage.getItem('pe_sync_key')||'';SYNC.name=localStorage.getItem('pe_sync_name')||''}catch(e){}
const SHARED=['users','watch','comments','persons','rel','news','over','ap','fin','macro','research','msrc','mcust','nid','w','wts','tomb','dbv'];
const cl=o=>JSON.parse(JSON.stringify(o));
function mergeState(R,L,meL){
  L=cl(L);
  if(!R)return L;
  R=cl(R);
  if(R.dbv!==D.dbv){R=Object.assign(DEF(),{users:R.users,w:R.w,wts:R.wts,macro:R.macro,research:R.research,msrc:R.msrc,mcust:R.mcust,nid:R.nid,tomb:R.tomb,dbv:D.dbv})}
  const out={};
  const U=[...(R.users||[])];(L.users||[]).forEach(n=>{if(!U.includes(n))U.push(n)});out.users=U;
  const mp=i=>{const n=(L.users||[])[i];const k=U.indexOf(n);return k<0?i:k};
  const T=Object.assign({},R.tomb||{},L.tomb||{});out.tomb=T;
  // commenti / notizie / ricerche: unione per id
  const uni=(a,b,t)=>{const m=new Map();(a||[]).forEach(x=>m.set(x.id,x));(b||[]).forEach(x=>{x.u=mp(x.u);if(!m.has(x.id))m.set(x.id,x)});return [...m.values()].filter(x=>!(t&&T[t+':'+x.id]))};
  out.comments=uni(R.comments,L.comments,'c');out.news=uni(R.news,L.news,null);out.research=uni(R.research,L.research,'r');
  // contatti: chiave = nome|cognome|fondo, id canonico = quello remoto
  const pk=p=>pkey(p.first,p.last,p.pe);
  const P=[...(R.persons||[])];let nid=Math.max(R.nid||1,L.nid||1,...P.map(p=>p.id+1),1);const idMap={};
  (L.persons||[]).forEach(p=>{const ex=P.find(q=>pk(q)==pk(p));if(ex){idMap[p.id]=ex.id;if(!ex.role&&p.role)ex.role=p.role;if(!ex.info&&p.info)ex.info=p.info;if(ex.co==null&&p.co!=null)ex.co=p.co}else{const id=P.some(q=>q.id==p.id)?nid++:p.id;idMap[p.id]=id;P.push(Object.assign({},p,{id}))}});
  out.persons=P.filter(p=>!T['p:'+pk(p)]);const idPk={};P.forEach(p=>idPk[p.id]=pk(p));
  out.nid=Math.max(nid,...P.map(p=>p.id+1));
  const rm=new Map();(R.rel||[]).forEach(r=>rm.set(r.p+'|'+r.u,r));
  (L.rel||[]).forEach(r=>{const n=Object.assign({},r,{p:idMap[r.p]??r.p,u:mp(r.u)});const k=n.p+'|'+n.u,e=rm.get(k);if(!e||(n.ts||0)>(e.ts||0))rm.set(k,n)});
  out.rel=[...rm.values()].filter(r=>{const pk_=idPk[r.p];if(!pk_)return false;const t=T['l:'+pk_+'|'+U[r.u]];return !(t&&t>=(r.ts||0))});
  // AP / override: vince il piu' recente, salvo cancellazione piu' recente
  const nw=(a,b,t)=>{const o={},ids=new Set([...Object.keys(a||{}),...Object.keys(b||{})]);ids.forEach(id=>{const x=(a||{})[id],y=(b||{})[id];if(y)y.u=mp(y.u);const w=!x?y:!y?x:((y.ts||0)>=(x.ts||0)?y:x);const d=T[t+':'+id];if(w&&!(d&&d>=(w.ts||0)))o[id]=w});return o};
  out.ap=nw(R.ap,L.ap,'a');out.over=nw(R.over,L.over,'o');
  out.fin={};new Set([...Object.keys(R.fin||{}),...Object.keys(L.fin||{})]).forEach(id=>{out.fin[id]=Object.assign({},(R.fin||{})[id],(L.fin||{})[id])});
  out.macro={};new Set([...Object.keys(R.macro||{}),...Object.keys(L.macro||{})]).forEach(id=>{const m=new Map();(R.macro||{})[id]&&R.macro[id].forEach(x=>m.set(x.d+'|'+x.u+'|'+x.v,x));(L.macro||{})[id]&&L.macro[id].forEach(x=>{x.u=x.u>=0?mp(x.u):x.u;m.set(x.d+'|'+x.u+'|'+x.v,x)});out.macro[id]=[...m.values()].sort((a,b)=>a.d.localeCompare(b.d))});
  // watchlist: ognuno e' autore della propria
  out.watch=Object.assign({},R.watch||{});const meF=U.indexOf((L.users||[])[meL]);if(meF>=0)out.watch[meF]=(L.watch||{})[meL]||[];
  out.msrc=Object.assign({},R.msrc,L.msrc);out.mcust=Object.assign({},R.mcust,L.mcust);
  out.w=(L.wts||0)>(R.wts||0)?L.w:R.w;out.wts=Math.max(L.wts||0,R.wts||0);out.dbv=D.dbv;
  const o={};SHARED.forEach(k=>o[k]=out[k]);return o;
}
function ensureMe(){
  if(!SYNC.name)return;
  if(S.users.length==1&&(S.users[0]==='Tu'||/^Collega \d+$/.test(S.users[0])))S.users=[SYNC.name];
  else if(!S.users.includes(SYNC.name))S.users.push(SYNC.name);
  S.me=S.users.indexOf(SYNC.name);
}
const sharedOf=()=>{const d={};SHARED.forEach(k=>d[k]=S[k]);return d};
async function syncApi(method,body){
  const r=await fetch(SYNC.url+'/state',{method,headers:Object.assign({'Content-Type':'application/json'},SYNC.az?{}:{'X-Team-Key':SYNC.key}),body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}return{status:r.status,j};
}
function syncMsg(m){SYNC.msg=m;const b=document.getElementById('syncbar');if(b)b.textContent=m;const e=document.getElementById('syncst');if(e)e.textContent=m}
async function syncNow(){
  if(!syncReady())return;
  if(SYNC.busy){SYNC.again=true;return}
  SYNC.busy=true;
  try{
    ensureMe();
    for(let i=0;i<4;i++){
      const g=await syncApi('GET');
      if(g.status===401||g.status===403){syncMsg(SYNC.az?'⚠ accesso non autorizzato o scaduto: ricarica la pagina':'⚠ codice team non valido');return}
      if(g.status!==200)throw new Error(g.j.error||g.status);
      const R=g.j.data?JSON.parse(g.j.data):null;
      const merged=mergeState(R,Object.assign(sharedOf()),S.me);
      const same=R&&JSON.stringify(merged)===JSON.stringify(Object.assign({},...SHARED.map(k=>({[k]:R[k]}))));
      const me=merged.users.indexOf(SYNC.name);
      S=Object.assign(DEF(),merged);S.me=me;
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      if(same){break}
      const p=await syncApi('PUT',{data:JSON.stringify(merged),sha:g.j.sha,by:SYNC.name});
      if(p.status===200)break;
      if(p.status!==409)throw new Error(p.j.error||p.status);
    }
    rescore();
    if(!document.querySelector('textarea:focus,input:focus'))render();
    syncMsg('● sincronizzato '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){console.error(e);syncMsg('⚠ sincronizzazione non riuscita ('+(e.message||e)+'), riprovo al prossimo salvataggio')}
  finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;setTimeout(syncNow,300)}}
}
window.syncPush=()=>{if(!syncReady())return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(syncNow,800)};
function syncSave(){
  SYNC.name=($('#sn').value||'').trim();SYNC.key=$('#sk').value||'';
  if(!SYNC.name||!SYNC.key)return alert('Inserisci nome e codice team');
  try{localStorage.setItem('pe_sync_name',SYNC.name);localStorage.setItem('pe_sync_key',SYNC.key)}catch(e){}
  syncMsg('sincronizzazione in corso…');syncNow();
}
if(SYNC.url&&location.protocol!=='file:'){
  const bar=document.createElement('div');bar.id='syncbar';document.body.appendChild(bar);
  if(SYNC.az){
    bar.textContent='accesso in corso…';
    fetch('/.auth/me').then(r=>r.json()).then(j=>{const u=j&&j.clientPrincipal;if(!u){bar.textContent='⚠ non autenticato';return}SYNC.name=u.userDetails||'utente';bar.textContent='sincronizzazione…';syncNow()}).catch(()=>{bar.textContent='⚠ accesso non disponibile'});
  }
  else if(!SYNC.name||!SYNC.key){bar.textContent='Sincronizzazione: inserisci nome e codice in Impostazioni'}
  else{bar.textContent='sincronizzazione…';setTimeout(syncNow,400)}
  setInterval(()=>{if(!document.hidden&&!document.querySelector('textarea:focus,input:focus'))syncNow()},90000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});
}

</script>
