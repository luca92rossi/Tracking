name: Aggiorna dati di settore

on:
  schedule:
    - cron: "0 6 * * 1"     # ogni lunedì alle 06:00 UTC
  workflow_dispatch:         # permette l'avvio manuale dal tab Actions

permissions:
  contents: write            # serve per fare commit di data.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Scarica i dati
        run: python scripts/fetch_data.py
        # Per fonti con chiave (es. FRED):
        # env:
        #   FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet || git commit -m "Aggiornamento dati $(date -u +%F)"
          git push
